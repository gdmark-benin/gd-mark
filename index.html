<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GD Mark</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}header{background:#111;color:#fff;padding:15px;text-align:center;position:sticky;top:0}h1{letter-spacing:3px}.badge{background:#25D366;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;display:inline-block;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1)}.card img{width:100%;height:170px;object-fit:cover}.card .info{padding:10px}.card button{width:100%;background:#25D366;color:#fff;border:none;padding:11px;border-radius:8px;font-weight:bold;margin-top:6px}#paywall{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}#paywall .box{background:#fff;color:#111;padding:25px;border-radius:16px;max-width:360px;width:100%;text-align:center}#paywall button{border:none;padding:13px;width:100%;border-radius:8px;margin-top:10px;font-weight:bold}#adminPanel{display:none;position:fixed;inset:0;background:#fff;z-index:50;padding:20px;overflow:auto}#adminPanel input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}</style></head><body><div id="paywall"><div class="box"><h2>GD MARK 🔒</h2><h3 style="color:red;margin:8px 0">ABONNEMENT SITE</h3><p><b>5695F / MOIS</b></p><div style="background:#fff3cd;padding:10px;border-radius:10px;margin:12px 0;text-align:left;font-size:13px;border:1px solid #ffc107"><b>À payer sur :</b><br>✅ MoMo: <b>0151441665</b><br><small>Envoie preuve sur WhatsApp 0151441665</small></div><button style="background:#ffc107;color:#111" onclick="payerAbonnement()">J'AI PAYÉ 5695F</button><button style="background:#111;color:#fff" onclick="dejaPaye()">J'AI MON CODE SECRET DU MOIS</button></div></div><header><h1>GD MARK</h1><p>BOUTIQUE - VÊTEMENTS HOMMES</p><span class="badge">Commandes: WhatsApp 0195389427</span></header><div class="grid" id="produits"></div><script>
const WHATSAPP_CLIENTE="2290195389427"; 
const WHATSAPP_MOI="2290151441665";
let produits=[{nom:"Chemise Homme Classe",prix:"15000F",img:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500"},{nom:"Chaussure Cuir Homme",prix:"25000F",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},{nom:"Sac à Dos Homme",prix:"18000F",img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"},{nom:"T-Shirt Oversize",prix:"8000F",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"}];
function checkAbonnement(){let pay=localStorage.getItem("gdmark_pay");let date=localStorage.getItem("gdmark_date");if(pay==="ok"&&date){let diff=(Date.now()-parseInt(date))/(1000*60*60*24);if(diff<=30){document.getElementById("paywall").style.display="none";}}}checkAbonnement();
function payerAbonnement(){let ref=prompt("Colle ici la référence MTN reçue par SMS après paiement 5695F sur 0151441665:");if(ref&&ref.length>=2){window.open(`https://wa.me/${WHATSAPP_MOI}?text=Bonjour dev, j'ai payé abonnement GD Mark 5695F sur 0151441665. Réf: ${ref}. Donne le code du mois svp`,"_blank");}else{alert("Mets la référence");}}
function hashCode(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h.toString();}
function dejaPaye(){
  // HASH DE TES VRAIS CODES SECRETS - Impossible à deviner même en lisant le code source
  const CODES_HASH = {
    "10-2026": "788228164",
// vrai code: GD-1026-OPEN
    "11-2026": "-1093807245", // vrai code: GD-5144-X9P2
    "12-2026": "1774423619",  // vrai code: MARK-77B-KL44
    "01-2027": "1887164103",  // vrai code: GD-1665-Z9Q1
    "02-2027": "-1551421790", // vrai code: GD-MARK-8K22
    "03-2027": "1934847110"
  };
  let d=new Date(); let cle=`${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
  let attendu=CODES_HASH[cle];
  if(!attendu){alert("Code non défini pour ce mois, contacte le dev 0151441665");return;}
  let code=prompt(`Code secret du mois ${cle} : (Demande au dev 0151441665 après avoir payé 5695F)`);
  if(!code) return;
  if(hashCode(code)===attendu){
    localStorage.setItem("gdmark_pay","ok"); localStorage.setItem("gdmark_date",Date.now().toString());
    document.getElementById("paywall").style.display="none"; alert("Validé ! Actif 30 jours");
  }else{ alert("Code faux. Ce code change chaque mois et est impossible à deviner. Paie 5695F sur 0151441665."); }
}
function afficher(){let saved=JSON.parse(localStorage.getItem("gd_produits")||"null");if(saved) produits=saved;let h="";produits.forEach(p=>{h+=`<div class="card"><img src="${p.img}"><div class="info"><h3>${p.nom}</h3><p style="color:#25D366;font-weight:bold">${p.prix}</p><button onclick="commander('${p.nom}','${p.prix}')">PAYER / COMMANDER SUR WHATSAPP</button></div></div>`;});document.getElementById("produits").innerHTML=h;}
function commander(n,p){window.open(`https://wa.me/${WHATSAPP_CLIENTE}?text=Salut GD Mark, je veux commander: ${n} à ${p}`,"_blank");}
afficher();
</script></body></html>
